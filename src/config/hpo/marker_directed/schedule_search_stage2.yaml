hpo:
  id: marker_directed_schedule_search
  method: marker_directed
  stage: stage2_schedule_search
  preset: default
  experiment_id: thesis_marker_hpo_stage2
  model_flag: SM4
  output_root: outputs/hpo
  skip_preprocess: true
  skip_baseline: true
  baseline_epochs: null

matrix:
  axes:
    budget: [b4096]
    seed: [s01, s02, s03]
    stage1:
      qbc_n0: [128]
      qbc_K: [128]
      qbc_T: [31]
      qbc_P: [2048, 4096, 8192]
  fixed_overrides:
    stage1:
      - qbc_enable_logging=true
      - active.log_every=5
      - qbc_n_test=256
      - active.candidate_method=lhs
      - active.marker.greedy_score_weight=0.7
      - active.marker.include_anchor_state_markers=true
      - active.marker.k_density=10
      - active.marker.pca_explained_variance=0.95
      - active.marker.preselect_factor=3
      - active.marker.settling_fraction=0.05
      - active.marker.weights.diversity=0.6
      - active.marker.weights.sparsity=0.4
    stage2: []
    stage3: []
  constraints:
    enforce_final_n_from_budget: true
    n0_key: qbc_n0
    k_key: qbc_K
    t_key: qbc_T
