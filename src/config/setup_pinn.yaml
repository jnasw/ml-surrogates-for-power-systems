defaults:
  - _self_
  - logging: default

time: 1.0
num_of_points: 1000
PINN_flag: true

model:
  model_flag: "SM4"
  machine_num: 1
  seed: 37

dataset:
  root: null # optional absolute/relative path to data/<MODEL>/dataset_vN; overrides dataset.number when set
  number: 1

pinn:
  mode: single_stage # single_stage | multistage
  hidden_dim: 64
  hidden_layers: 4
  activation: tanh
  dtype: float64
  device: auto # auto | cuda | mps | cpu
  deterministic: false
  deterministic_strict: false
  formulation: odequations # odequations | odequations_v2
  default_batch_size: 1024
  gradient_telemetry:
    enabled: false
  collocation_sampling:
    enabled: false
    rows_per_epoch: null
    fraction_per_epoch: null
  supervised_sampling:
    enabled: false
    rows_per_epoch: null
    fraction_per_epoch: null
  evaluation:
    frequency: 1
  checkpointing:
    save_init: true
    epoch_fractions: []
    save_best: true
    save_last: true
  analysis_dataset:
    split: train
    supervised_rows: null
    collocation_rows: null
    init_rows: null
    seed: 0
    require_all_components: true
  landscape:
    output_dir: null
    grid:
      type: 2d
      resolution: 21
      alpha_min: -1.0
      alpha_max: 1.0
      beta_min: -1.0
      beta_max: 1.0
    direction_seed: 0
    normalization: filter
  loss_weights:
    # Backward compatibility:
    # These remain the static weights when pinn.weighting.scheme=static.
    # For dynamic schemes, these act as base/initial values, while physics is
    # fixed to the anchor value 1.0 in v1.
    data: 1.0
    dt: 1.0e-4
    physics: 1.0e-4
    ic: 1.0e-3
  weighting:
    scheme: static # static | ma | id | dn
    anchor: physics # v1 keeps the paper-style anchor fixed to physics
    ema_beta: 0.99
    update_interval_epochs: 10
    dynamic_components: [data, dt, ic]
    probe:
      # Fixed training subset used only for dynamic weight updates.
      data_rows: 256
      physics_rows: 256
      init_rows: 256
      seed: 0
  multistage:
    max_stages: 2
    stop:
      residual_rms_threshold: 1.0e-6
    analysis:
      collocation_rows: 2048
      seed: 0
    base_stage:
      first_activation: ${pinn.activation}
      hidden_activation: ${pinn.activation}
      optimizer_phases: null
    residual_stage:
      first_activation: sin
      hidden_activation: tanh
      epsilon: 1.0
      kappa_min: 1.0
      kappa_max: 100.0
      optimizer_phases:
        - name: adam_residual
          optimizer: Adam
          lr: 0.001
          epochs: 300
          batch_size: 1024
          shuffle: true
          full_batch: false
          allow_sampling: false
          optimizer_kwargs: {}
          line_search: null
          convergence: null
  optimizer_phases:
    - name: adam
      optimizer: Adam
      lr: 0.001
      epochs: 100
      batch_size: 1024
      shuffle: true
      full_batch: false
      allow_sampling: true
      optimizer_kwargs: {}
      line_search: null
      convergence: null
    - name: lbfgs
      optimizer: LBFGS
      lr: 1.0
      epochs: 20
      batch_size: null
      shuffle: false
      full_batch: true
      allow_sampling: false
      optimizer_kwargs: {}
      line_search:
        name: strong_wolfe
      convergence: null
  # Example SSBFGS optimizer-phase override:
  # optimizer_phases:
  #   - name: ssbfgs
  #     optimizer: SSBFGS
  #     lr: 1.0
  #     epochs: 20
  #     batch_size: null
  #     shuffle: false
  #     full_batch: true
  #     allow_sampling: false
  #     optimizer_kwargs:
  #       tau_strategy: al_baali
  #       tau_min: 1.0e-12
  #       tau_max: 1.0
  #     line_search:
  #       name: strong_wolfe
  #     convergence: null
  #   - name: ssbroyden
  #     optimizer: SSBroyden
  #     lr: 1.0
  #     epochs: 20
  #     batch_size: null
  #     shuffle: false
  #     full_batch: true
  #     allow_sampling: false
  #     optimizer_kwargs:
  #       tau_strategy: paper_default
  #       phi_strategy: paper_default
  #       tau_min: 1.0e-12
  #       tau_max: 1.0
  #       phi_min: -1.0e6
  #       phi_max: 1.0e6
  #     line_search:
  #       name: strong_wolfe
  #     convergence: null
  run_dir: ${hydra:runtime.cwd}/outputs/pinn

dirs:
  params_dir: ${hydra:runtime.cwd}/src/config/params
  dataset_dir: ${hydra:runtime.cwd}/data
