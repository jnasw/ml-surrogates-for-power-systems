campaign:
  name: dataset_benchmark_8k_shared_test_SM6
  experiment_id: thesis_sm6_dataset_benchmark_8k_shared_test_SM6_v1
  preset: default
  model_flag: SM6
  skip_preprocess: false
  skip_baseline: false
  baseline_epochs: 80
  continue_on_error: true

# Build one external/fixed test source once, then force all methods to evaluate
# on that exact same test set in stage-2 preprocess.
shared_test:
  enabled: true
  method: lhs_static
  budget: b8192
  seed: s01
  max_trajectories: 4096
  stage1_overrides:
    - model.ic_generation_method=joint_lhs

# 4 methods x 3 seeds = 12 runs.
axes:
  method: [lhs_static, qbc_deep_ensemble, marker_directed, qbc_marker_hybrid]
  budget: [b8192]
  seed: [s01, s02, s03]

exclude: []

cleanup:
  prune_run_raw_data: true
  prune_run_qbc_artifacts: true
  prune_shared_test_raw_data: false

stage_overrides:
  stage1:
    - qbc_enable_logging=true
    - active.log_every=5
    - qbc_n_test=0
  stage2:
    - dataset.validation_flag=true
    - dataset.split_ratio=0.9
    - dataset.new_coll_points_flag=false
  stage3:
    - baseline.batch_size=128

run_overrides:
  - match:
      method: qbc_deep_ensemble
    stage1:
      - qbc_M=5
      - qbc_P=8192
      - active.candidate_method=lhs
      - active.disagreement.metric=member_l2_mean
      - active.diversity.preselect_factor=3
      - active.diversity.uncertainty_weight=0.6
      - active.diversity.distance_weight=0.4

  - match:
      method: marker_directed
    stage1:
      - qbc_P=4096
      - active.candidate_method=lhs
      - active.marker.pca_explained_variance=0.9
      - active.marker.k_density=20
      - active.marker.preselect_factor=3
      - active.marker.greedy_score_weight=0.9
      - active.marker.weights.diversity=0.8
      - active.marker.weights.sparsity=0.4
      - active.marker.settling_fraction=0.05
      - active.marker.include_anchor_state_markers=true

  - match:
      method: qbc_marker_hybrid
    stage1:
      - qbc_M=5
      - qbc_P=4096
      - active.candidate_method=lhs
      - active.disagreement.metric=member_l2_mean
      - active.acquisition_strategy=qbc_marker_hybrid
      - active.hybrid.pca_explained_variance=0.9
      - active.hybrid.k_density=20
      - active.hybrid.preselect_factor=3
      - active.hybrid.greedy_score_weight=0.9
      - active.hybrid.settling_fraction=0.05
      - active.hybrid.include_anchor_state_markers=true
      - active.hybrid.weights.uncertainty=0.6
      - active.hybrid.weights.diversity=0.2667
      - active.hybrid.weights.sparsity=0.1333
