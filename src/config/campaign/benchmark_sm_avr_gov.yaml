campaign:
  name: benchmark_sm_avr_gov
  experiment_id: thesis_sm_avr_gov_benchmark_v1
  preset: default
  model_flag: SM_AVR_GOV
  skip_preprocess: false
  skip_baseline: false
  baseline_epochs: 80
  continue_on_error: true

shared_test:
  enabled: true
  method: lhs_static
  budget: b16384
  dataset_seed: ds01
  max_trajectories: 8192
  stage1_overrides:
    - model.ic_generation_method=joint_lhs

axes:
  method: [lhs_static, qbc_deep_ensemble, marker_directed, qbc_marker_hybrid]
  budget: [b1024, b4096, b8192]
  dataset_seed: [ds01, ds02, ds03, ds04, ds05]

baseline_seeds: [bs01, bs02, bs03]

exclude: []

cleanup:
  prune_run_raw_data: true
  prune_run_qbc_artifacts: true
  prune_shared_test_raw_data: true

hpo_integration:
  enabled: true
  winners_csv: results/hpo/hpo_winners.csv
  policies:
    - method: qbc_deep_ensemble
      workflow_id: qbc_deep_ensemble_sm_avr_gov_v1
      preferred_stages: [confirm, refine, policy]
      allow_missing: true
      stage1_keys:
        - qbc_M
        - active.disagreement.metric
        - active.diversity.preselect_factor
        - active.diversity.uncertainty_weight
        - active.diversity.distance_weight
    - method: marker_directed
      workflow_id: marker_directed_sm_avr_gov_v1
      preferred_stages: [confirm, refine, policy]
      allow_missing: true
      stage1_keys:
        - active.marker.pca_explained_variance
        - active.marker.k_density
        - active.marker.preselect_factor
        - active.marker.greedy_score_weight
        - active.marker.weights.diversity
        - active.marker.weights.sparsity
    - method: qbc_marker_hybrid
      workflow_id: qbc_marker_hybrid_sm_avr_gov_v1
      preferred_stages: [confirm, refine, policy]
      allow_missing: true
      stage1_keys:
        - qbc_M
        - active.disagreement.metric
        - active.hybrid.pca_explained_variance
        - active.hybrid.k_density
        - active.hybrid.preselect_factor
        - active.hybrid.greedy_score_weight
        - active.hybrid.weights.uncertainty
        - active.hybrid.weights.diversity
        - active.hybrid.weights.sparsity

stage_overrides:
  stage1:
    - qbc_enable_logging=true
    - active.log_every=5
    - qbc_n_test=0
  stage2:
    - dataset.validation_flag=true
    - dataset.split_ratio=0.9
    - dataset.new_coll_points_flag=false
  stage3:
    - baseline.batch_size=128

run_overrides:
  # Transfer defaults from the current SM4 HPO winners until SM_AVR_GOV workflow HPO finishes.
  - match:
      method: qbc_deep_ensemble
    stage1:
      - qbc_M=5
      - active.candidate_method=lhs
      - active.disagreement.metric=member_l2_mean
      - active.diversity.preselect_factor=3
      - active.diversity.uncertainty_weight=0.6
      - active.diversity.distance_weight=0.4
  - match:
      method: qbc_deep_ensemble
      budget: b1024
    stage1:
      - qbc_P=2048
  - match:
      method: qbc_deep_ensemble
      budget: b4096
    stage1:
      - qbc_P=4096
  - match:
      method: qbc_deep_ensemble
      budget: b8192
    stage1:
      - qbc_P=4096

  - match:
      method: marker_directed
    stage1:
      - active.candidate_method=lhs
      - active.marker.pca_explained_variance=0.95
      - active.marker.k_density=10
      - active.marker.preselect_factor=3
      - active.marker.greedy_score_weight=0.7
      - active.marker.weights.diversity=0.6
      - active.marker.weights.sparsity=0.4
      - active.marker.settling_fraction=0.05
      - active.marker.include_anchor_state_markers=true
  - match:
      method: marker_directed
      budget: b1024
    stage1:
      - qbc_P=2048
  - match:
      method: marker_directed
      budget: b4096
    stage1:
      - qbc_P=4096
  - match:
      method: marker_directed
      budget: b8192
    stage1:
      - qbc_P=4096

  - match:
      method: qbc_marker_hybrid
    stage1:
      - qbc_M=5
      - active.candidate_method=lhs
      - active.disagreement.metric=member_l2_mean
      - active.acquisition_strategy=qbc_marker_hybrid
      - active.hybrid.pca_explained_variance=0.95
      - active.hybrid.k_density=10
      - active.hybrid.preselect_factor=3
      - active.hybrid.greedy_score_weight=0.7
      - active.hybrid.settling_fraction=0.05
      - active.hybrid.include_anchor_state_markers=true
      - active.hybrid.weights.uncertainty=0.5
      - active.hybrid.weights.diversity=0.3
      - active.hybrid.weights.sparsity=0.2
  - match:
      method: qbc_marker_hybrid
      budget: b1024
    stage1:
      - qbc_P=2048
  - match:
      method: qbc_marker_hybrid
      budget: b4096
    stage1:
      - qbc_P=4096
  - match:
      method: qbc_marker_hybrid
      budget: b8192
    stage1:
      - qbc_P=4096
