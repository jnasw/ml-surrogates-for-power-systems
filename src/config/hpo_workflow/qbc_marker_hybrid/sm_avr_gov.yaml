workflow:
  id: qbc_marker_hybrid_sm_avr_gov_v1
  version: 1
  method: qbc_marker_hybrid
  model_flag: SM_AVR_GOV
  preset: default
  experiment_id_prefix: thesis_hybrid_sm_avr_gov_hpo
  output_root: outputs/hpo_workflows

stages:
  smoke:
    enabled: true
    role: smoke
    budget: b256
    seeds: [s01]
    objective:
      metric: success
      direction: maximize
      aggregation: pass_fail
      tie_breakers: []
    ranking:
      group_by:
        - qbc_M
        - active.disagreement.metric
        - active.hybrid.pca_explained_variance
        - active.hybrid.k_density
        - active.hybrid.preselect_factor
        - active.hybrid.greedy_score_weight
        - active.hybrid.weights.uncertainty
        - active.hybrid.weights.diversity
        - active.hybrid.weights.sparsity
        - qbc_P
    search:
      stage1:
        active.hybrid.pca_explained_variance: [0.9]
        active.hybrid.k_density: [10]
        active.hybrid.preselect_factor: [3]
        active.hybrid.greedy_score_weight: [0.7]
        hybrid_weight_profile: [balanced]
    fixed_overrides:
      stage1:
        - qbc_enable_logging=true
        - active.log_every=5
        - active.candidate_method=lhs
        - active.acquisition_strategy=qbc_marker_hybrid
        - active.hybrid.settling_fraction=0.05
        - active.hybrid.include_anchor_state_markers=true
        - qbc_n_test=64
        - qbc_n0=32
        - qbc_K=32
        - qbc_T=7
        - qbc_P=512
        - qbc_M=5
        - active.disagreement.metric=member_l2_mean
      stage2: []
      stage3: []
    derive:
      stage1:
        hybrid_weight_profiles:
          profile_key: hybrid_weight_profile
          profiles:
            qbc_heavy:
              uncertainty: 0.6
              diversity: 0.25
              sparsity: 0.15
            balanced:
              uncertainty: 0.5
              diversity: 0.3
              sparsity: 0.2
            marker_heavy:
              uncertainty: 0.4
              diversity: 0.4
              sparsity: 0.2
    constraints:
      enforce_final_n_from_budget: true
      n0_key: qbc_n0
      k_key: qbc_K
      t_key: qbc_T
    shortlist:
      top_k: 1

  policy:
    enabled: true
    role: broad_policy_search
    depends_on: smoke
    budget: b1024
    seeds: [s01, s02]
    objective:
      metric: final_eval_rmse
      direction: minimize
      aggregation: mean_over_dataset_seeds
      tie_breakers:
        - std_over_dataset_seeds
        - mean_final_round_seconds
    ranking:
      group_by:
        - qbc_M
        - active.disagreement.metric
        - active.hybrid.pca_explained_variance
        - active.hybrid.k_density
        - active.hybrid.preselect_factor
        - active.hybrid.greedy_score_weight
        - active.hybrid.weights.uncertainty
        - active.hybrid.weights.diversity
        - active.hybrid.weights.sparsity
    search:
      stage1:
        active.hybrid.pca_explained_variance: [0.9, 0.95]
        active.hybrid.k_density: [10, 20]
        active.hybrid.preselect_factor: [3]
        active.hybrid.greedy_score_weight: [0.7, 0.9]
        hybrid_weight_profile: [qbc_heavy, balanced]
    fixed_overrides:
      stage1:
        - qbc_enable_logging=true
        - active.log_every=5
        - active.candidate_method=lhs
        - active.acquisition_strategy=qbc_marker_hybrid
        - active.hybrid.settling_fraction=0.05
        - active.hybrid.include_anchor_state_markers=true
        - qbc_n_test=256
        - qbc_n0=64
        - qbc_K=64
        - qbc_T=15
        - qbc_P=2048
        - qbc_M=5
        - active.disagreement.metric=member_l2_mean
      stage2: []
      stage3: []
    derive:
      stage1:
        hybrid_weight_profiles:
          profile_key: hybrid_weight_profile
          profiles:
            qbc_heavy:
              uncertainty: 0.6
              diversity: 0.25
              sparsity: 0.15
            balanced:
              uncertainty: 0.5
              diversity: 0.3
              sparsity: 0.2
            marker_heavy:
              uncertainty: 0.4
              diversity: 0.4
              sparsity: 0.2
    constraints:
      enforce_final_n_from_budget: true
      n0_key: qbc_n0
      k_key: qbc_K
      t_key: qbc_T
    shortlist:
      top_k: 2

  refine:
    enabled: true
    role: refinement_and_schedule_search
    depends_on: policy
    budget: b4096
    seeds: [s01, s02]
    objective:
      metric: final_eval_rmse
      direction: minimize
      aggregation: mean_over_dataset_seeds
      tie_breakers:
        - std_over_dataset_seeds
        - mean_final_round_seconds
    ranking:
      group_by:
        - qbc_M
        - active.disagreement.metric
        - active.hybrid.pca_explained_variance
        - active.hybrid.k_density
        - active.hybrid.preselect_factor
        - active.hybrid.greedy_score_weight
        - active.hybrid.weights.uncertainty
        - active.hybrid.weights.diversity
        - active.hybrid.weights.sparsity
        - qbc_P
    inherit:
      mode: shortlist
      top_k: 2
      from_artifact: stage_shortlist.json
    narrowing:
      lock_params:
        - qbc_M
        - active.disagreement.metric
        - active.hybrid.pca_explained_variance
        - active.hybrid.k_density
        - active.hybrid.weights.uncertainty
        - active.hybrid.weights.diversity
        - active.hybrid.weights.sparsity
      refine:
        active.hybrid.preselect_factor:
          mode: neighbors_from_grid
          values: [3, 5]
          radius: 1
        active.hybrid.greedy_score_weight:
          mode: neighbors_from_grid
          values: [0.7, 0.9]
          radius: 1
      new_axes:
        stage1:
          qbc_P: [2048, 4096, 8192]
    fixed_overrides:
      stage1:
        - qbc_enable_logging=true
        - active.log_every=5
        - active.candidate_method=lhs
        - active.acquisition_strategy=qbc_marker_hybrid
        - active.hybrid.settling_fraction=0.05
        - active.hybrid.include_anchor_state_markers=true
        - qbc_n_test=256
        - qbc_n0=128
        - qbc_K=128
        - qbc_T=31
      stage2: []
      stage3: []
    constraints:
      enforce_final_n_from_budget: true
      n0_key: qbc_n0
      k_key: qbc_K
      t_key: qbc_T
    shortlist:
      top_k: 2

  confirm:
    enabled: false
    role: benchmark_ready_confirmation
    depends_on: refine
    budget: b8192
    seeds: [s01, s02, s03]
    objective:
      metric: final_eval_rmse
      direction: minimize
      aggregation: mean_over_dataset_seeds
      tie_breakers:
        - std_over_dataset_seeds
        - mean_final_round_seconds
    ranking:
      group_by:
        - qbc_M
        - active.disagreement.metric
        - active.hybrid.pca_explained_variance
        - active.hybrid.k_density
        - active.hybrid.preselect_factor
        - active.hybrid.greedy_score_weight
        - active.hybrid.weights.uncertainty
        - active.hybrid.weights.diversity
        - active.hybrid.weights.sparsity
        - qbc_P
    inherit:
      mode: shortlist
      top_k: 3
      from_artifact: stage_shortlist.json
    narrowing:
      lock_params:
        - qbc_M
        - active.disagreement.metric
        - active.hybrid.pca_explained_variance
        - active.hybrid.k_density
        - active.hybrid.preselect_factor
        - active.hybrid.greedy_score_weight
        - active.hybrid.weights.uncertainty
        - active.hybrid.weights.diversity
        - active.hybrid.weights.sparsity
        - qbc_P
      refine_params: []
      new_axes: {}
    fixed_overrides:
      stage1:
        - qbc_enable_logging=true
        - active.log_every=5
        - active.candidate_method=lhs
        - active.acquisition_strategy=qbc_marker_hybrid
        - active.hybrid.settling_fraction=0.05
        - active.hybrid.include_anchor_state_markers=true
        - qbc_n_test=256
        - qbc_n0=256
        - qbc_K=256
        - qbc_T=31
      stage2: []
      stage3: []
    constraints:
      enforce_final_n_from_budget: true
      n0_key: qbc_n0
      k_key: qbc_K
      t_key: qbc_T
